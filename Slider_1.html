<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

    }
    .heading{
        display: flex;
        flex-direction: column;
   
    }
    .slider{
        position: relative;
    
        height: 600px;
        width: 800px;
        overflow: hidden;
        
    }
    .slides{
        display: flex;
        width: 500%;
        justify-content: center;
        align-items: center;

    }
    .slides img{
        height: 600px;
        width: 800px;
        
    }
    .slider input{
        display: none;
    }
    .navigation{
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center; 
        bottom: 5px; 
        gap: 5px;
        left: 40%;
        

    }
    .navigation label{
        display: flex;
        border-radius: 50%;
        border: 5px solid red;
        height: 20px;
        width: 20px;
        cursor: pointer;
        
    }
    .navigation label:hover{
        background-color: black;
        box-shadow: 0 0 25px yellow;
    }
    #m1:checked ~ .slides{
        margin-left: 0;
    }
    #m2:checked ~ .slides{
        margin-left: -100%;
    }
    #m3:checked ~ .slides{
        margin-left: -200%;
    }
    #m4:checked ~ .slides{
        margin-left: -300%;
    }
    #m5:checked ~ .slides{
        margin-left: -400%;
    }


</style>
<body>

    <h1 class="heading">Slider <b></b></h1>
    <h2>Simple Slider with Html/Css</h2>
    <h3>New Heading</h3>

    <div class="slider">
  
     
                <input type="radio" name="slider" id="m1" checked>
                <input type="radio" name="slider" id="m2">
                <input type="radio" name="slider" id="m3">
                <input type="radio" name="slider" id="m4">
                <input type="radio" name="slider" id="m5">
          

            <div class="slides">

            <img src="assets/img1.jpeg" alt="img1">
            <img src="assets/img2.jpeg" alt="img2">
            <img src="assets/img3.jpeg" alt="img3">
            <img src="assets/img4.jpeg" alt="img4">
            <img src="assets/img5.jpeg" alt="img5">
           </div>
        <div class="navigation">
            <label for="m1"></label>
            <label for="m2"></label>
            <label for="m3"></label>
            <label for="m4"></label>
            <label for="m5"></label>
        </div>
        Add this line to the 3rd commit
        add
    </div>
</body>
</html>
